{% extends "base.html" %}
{% block title %}Tahrirlash — {{ resource.title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto glass rounded-2xl p-8">
  <div class="text-center mb-6">
    <i data-lucide="pencil" class="w-10 h-10 mx-auto text-brand-600 mb-2"></i>
    <h1 class="text-2xl font-bold">Materialni tahrirlash</h1>
    <p class="text-sm text-gray-400 mt-1">{{ resource.title }}</p>
  </div>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-1">Sarlavha</label>
      {{ form.title }}
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Tavsif</label>
      {{ form.description }}
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Kategoriya</label>
      {{ form.category }}
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Status</label>
      {{ form.status }}
    </div>

    <div class="flex gap-3 pt-2">
      <a href="{% url 'resource_detail' resource.slug %}"
         class="flex-1 py-3 rounded-xl glass hover:bg-gray-100 dark:hover:bg-gray-800 font-medium text-center transition">
        Bekor qilish
      </a>
      <button type="submit" class="flex-1 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-5 h-5"></i> Saqlash
      </button>
    </div>
  </form>
</div>
{% endblock %}
